<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progetti web · Faber Italia</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --fondo: #f6f5f3;
    --testo: #2f2c33;
    --secondario: #6a6570;
    --filetto: #dedad5;
    --accento: #ed1e79;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--testo);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.1; margin: 0 0 8px; }
  .sottotitolo { color: var(--secondario); margin: 0 0 36px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--filetto); }
  li { border-bottom: 1px solid var(--filetto); }
  a, .in-preparazione {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 20px 4px;
    color: inherit;
    text-decoration: none;
  }
  a:hover strong { color: var(--accento); }
  strong { font-size: 1.2rem; }
  span { color: var(--secondario); font-size: .92rem; text-align: right; }
  a span::after { content: " →"; color: var(--accento); }
  :focus-visible { outline: 3px solid var(--accento); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Progetti web</h1>
  <p class="sottotitolo">Siti di prova pubblicati da GitHub. Ogni progetto ha la sua cartella.</p>
  <ul>
    <li><a href="gatto/"><strong>Gatto</strong><span>Clinica veterinaria per gatti</span></a></li>
    <li><a href="https://github.com/uber-mastermas/sito-web/tree/main/duchessa"><strong>Duchessa</strong><span>L'Olio della Duchessa · sito PHP, si vede sul server</span></a></li>
  </ul>
</main>
</body>
</html>
